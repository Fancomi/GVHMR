<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>七源羽毛球 · 回合与 SMPL</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111722;color:#e9eff8;font:15px system-ui}main{max-width:1700px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}.muted{color:#aebed3}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{background:#253248;color:inherit;border:1px solid #526782;padding:10px;border-radius:7px}button{cursor:pointer}button:hover{background:#354a68}input[type=range]{flex:1;min-width:200px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}.view{position:relative;background:#080d15;border-radius:10px;overflow:hidden;aspect-ratio:16/9}video,canvas{position:absolute;width:100%;height:100%;object-fit:contain}.label{position:absolute;top:10px;left:12px;padding:5px 8px;background:#111a2cbb;border-radius:4px;z-index:2}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.card{padding:14px;background:#1b2636;border-radius:8px;min-width:180px}.card strong{display:block;font-size:24px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{text-align:left;padding:10px;border-bottom:1px solid #344257}#error{color:#ffb6a1}#fitInfo{min-height:25px;margin-top:12px;font-variant-numeric:tabular-nums}.active{color:#7cc9ff}a{color:#9fd7ff}@media(max-width:850px){.views{grid-template-columns:1fr}main{padding:14px}table{font-size:12px}td,th{padding:6px}}
.inspection{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.inspection iframe{width:100%;height:700px;border:1px solid #344257;border-radius:9px}.inspection .views{grid-template-columns:1fr}@media(max-width:1000px){.inspection{grid-template-columns:1fr}.inspection iframe{height:500px}}
</style>
<main><h1>羽毛球回合 · 双相机与拟合</h1><div class="muted">7 个来源 · 204 个回合 · 双相机、真实点云与完整 SMPL 网格同步播放；生成状态持续更新。</div>
<div class="cards"><div class="card"><strong id="rallyMinutes">载入中</strong>去重回合窗口</div><div class="card"><strong id="inputScans">载入中</strong>回合内可配对点云输入</div><div class="card"><strong id="accepted">构建中</strong>双相机筛选后的可用人帧</div></div>
<nav><label>来源 <select id="source"></select></label><label>回合 <select id="rally"></select></label><button id="previous">上一回合</button><button id="next">下一回合</button></nav>
<div class="inspection"><iframe id="scene" src="/scene/?embedded" title="SMPL 与 LiDAR 三维播放器"></iframe><div class="views"><div class="view"><span class="label">CAM 1</span><video id="cam1" muted playsinline preload="metadata"></video><canvas id="overlay1" width="1920" height="1080"></canvas></div><div class="view"><span class="label">CAM 2</span><video id="cam2" muted playsinline preload="metadata"></video><canvas id="overlay2" width="1920" height="1080"></canvas></div></div>
</div><nav><select id="mode"><option value="paired" selected>三维 / 投影同步</option><option value="native">双机原片</option></select><label><input type="checkbox" id="projectCloud" checked>点云投影</label><button id="play">播放</button><button id="back">−1 秒</button><button id="forward">+1 秒</button><input id="seek" type="range" min="0" max="1" value="0" step="0.001"><span id="time">0.00 s</span><select id="speed"><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select><label><input type="checkbox" id="loop" checked>回合循环</label><button id="exact">查看精确配对帧</button></nav>
<div id="fitInfo" class="muted">配对模式使用每个扫描实际对应的双机原生帧；三维网格、点云和两机投影共用这一帧时钟。</div><div id="error"></div>
<table><thead><tr><th>来源</th><th>回合</th><th>回合点云帧</th><th>状态</th><th>已拟合人帧</th><th>SMPL QA 通过</th><th>拟合排除</th></tr></thead><tbody id="status"></tbody></table>
<p class="muted">精确配对帧：彩色网格与骨架为已存储 SMPL，黄色为真实人体点云。缺少拟合时明确显示待处理。窗口分钟、输入扫描帧与合格人帧分别统计。人体标签为拟合伪标签。</p>
</main><script src="/viewer.js"></script></html>
