[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gvhmr"
version = "1.0.0"
description = "GVHMR training and inference"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.3.0+cu121",
    "torchvision==0.18.0+cu121",
    "timm==0.9.12",
    "lightning==2.3.0",
    "pytorch-lightning==2.3.0",
    "hydra-core==1.3.2",
    "hydra-zen",
    "hydra-colorlog",
    "rich",
    "numpy==1.23.5",
    "matplotlib<3.9",
    "ipdb",
    "setuptools>=68,<81",
    "pip",
    "wheel",
    "ninja",
    "tensorboardX",
    "opencv-python==4.10.0.84",
    "ffmpeg-python",
    "imageio-ffmpeg",
    "scikit-image==0.22.0",
    "termcolor",
    "einops",
    "imageio==2.34.1",
    "av==13.0.0",
    "joblib",
    "pytorch3d==0.7.6",
    "fvcore==0.1.5.post20221221",
    "iopath==0.1.10",
    "trimesh",
    "chumpy==0.70",
    "smplx==0.1.28",
    "wis3d",
    "pycolmap==3.13.0",
    "ultralytics==8.2.42",
    "cython-bbox==0.1.5",
    "lapx==0.5.11.post1",
]

[project.optional-dependencies]
dev = ["black", "jupyter"]
compat = ["roma==1.5.0", "loguru==0.7.3"]
serve = ["flask>=3.0,<4.0"]

[tool.setuptools.packages.find]
include = ["hmr4d*"]

[tool.setuptools.package-data]
hmr4d = ["configs/**/*.yaml", "utils/body_model/*.pt", "utils/body_model/*.json", "network/hmr2/configs/*"]

[tool.uv]
link-mode = "copy"
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
no-build-isolation-package = ["pytorch3d", "chumpy"]

[tool.uv.extra-build-dependencies]
cython-bbox = ["numpy==1.23.5"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
pytorch3d = [
    { path = ".build-tools/pytorch3d", marker = "sys_platform == 'win32'" },
    { url = "https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu121_pyt230/pytorch3d-0.7.6-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
